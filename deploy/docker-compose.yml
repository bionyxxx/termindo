# Termindo sync server for a VPS. Full guide: docs/deploy-vps.md
#
#   cp .env.example .env                    # fill in TERMINDO_DOMAIN, secrets
#   docker compose --profile tls up -d      # Postgres + server + Caddy (HTTPS) + backups
#   ./update.sh                             # later: pull the newest image and restart
#
# Without the `tls` profile the server listens on 127.0.0.1:${TERMINDO_PORT} only,
# for use behind a reverse proxy you already run.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: termindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: termindo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termindo -d termindo"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # Prebuilt by .github/workflows/server-image.yml. `docker compose build` builds
    # from source instead (needs ~2 GB RAM).
    image: ${TERMINDO_IMAGE:-ghcr.io/bionyxxx/termindo-server:latest}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://termindo:${POSTGRES_PASSWORD}@postgres:5432/termindo
      TERMINDO_JWT_SECRET: ${TERMINDO_JWT_SECRET:?set TERMINDO_JWT_SECRET in .env (>= 32 chars)}
      TERMINDO_ALLOW_REGISTRATION: ${TERMINDO_ALLOW_REGISTRATION:-true}
      TERMINDO_TRUST_PROXY: ${TERMINDO_TRUST_PROXY:-false}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Loopback only: from the internet the server is reachable through Caddy (HTTPS).
      - "127.0.0.1:${TERMINDO_PORT:-8080}:8080"

  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [server]
    environment:
      TERMINDO_DOMAIN: ${TERMINDO_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    # Daily pg_dump with rotation. Dumps contain only what the server stores:
    # ciphertext, password hashes and metadata (no plaintext secrets).
    image: prodrigestivill/postgres-backup-local:17
    profiles: ["tls", "backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: termindo
      POSTGRES_USER: termindo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_ON_START: ${BACKUP_ON_START:-FALSE}
    volumes:
      - ./backups:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:

name: Installers

# Builds the desktop installers for every OS.
# - Manual run (Actions tab / `gh workflow run bundle.yml`) or a change to this
#   workflow / the Tauri config: installers are uploaded as workflow artifacts.
# - Tag `v*` (e.g. `git tag v0.1.0 && git push --tags`): additionally creates a
#   draft GitHub release with all installers attached, plus `latest.json` for the
#   in-app updater (tauri-plugin-updater).
#
# In-app updates:
# - Tag builds pass `--config src-tauri/tauri.updater.conf.json`, which turns on
#   `bundle.createUpdaterArtifacts`. Tauri then signs the AppImage, MSI and NSIS
#   installers and the macOS `.app.tar.gz` with the minisign key from the secrets
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD, writing `*.sig`.
#   PR and manual builds skip this, so they pass without access to the secrets.
# - The `release` job runs scripts/make-latest-json.mjs, which fails if any platform
#   lacks a signature, and attaches `latest.json`. The app reads it from
#   releases/latest/download/latest.json, so users see an update only once the
#   draft is published.
# - The public key lives in tauri.conf.json (plugins.updater.pubkey). Losing the
#   private key means installed versions can no longer be updated in-app.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/bundle.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/tauri.updater.conf.json"
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: windows
            os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.name }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Check updater signing setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1
          fi
          if grep -q REPLACE_WITH_UPDATER_PUBKEY apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still a placeholder"; exit 1
          fi
      - name: Build installers
        working-directory: apps/desktop
        env:
          # Default sync server shown in the app (Settings → Variables → TERMINDO_SYNC_URL).
          VITE_DEFAULT_SYNC_URL: ${{ vars.TERMINDO_SYNC_URL }}
          # Release endpoint for the update check (GitHub "latest release" JSON).
          # Empty = api.github.com/repos/bionyxxx/termindo/releases/latest.
          TERMINDO_UPDATE_URL: ${{ vars.TERMINDO_UPDATE_URL }}
          # Updater signing key (tag builds only, see the top of this file).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.updater.conf.json' || '' }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: termindo-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/appimage/*.AppImage.sig
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/macos/*.app.tar.gz.sig
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/msi/*.msi.sig
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/nsis/*.exe.sig

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build latest.json
        # Fails when a platform has no signature, so no release ships a partial manifest.
        run: |
          node scripts/make-latest-json.mjs dist "${GITHUB_REF_NAME}" dist/latest.json
          cat dist/latest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "Termindo ${GITHUB_REF_NAME}" \
            $(find dist -type f)

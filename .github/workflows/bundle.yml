name: Installers

# Builds the desktop installers for every OS.
# - Manual run (Actions tab / `gh workflow run bundle.yml`) or a change to this
#   workflow / the Tauri config: installers are uploaded as workflow artifacts.
# - Tag `v*` (e.g. `git tag v0.1.0 && git push --tags`): additionally creates a
#   draft GitHub release with all installers attached.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/bundle.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: windows
            os: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.name }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build installers
        working-directory: apps/desktop
        env:
          # Default sync server shown in the app (Settings → Variables → TERMINDO_SYNC_URL).
          VITE_DEFAULT_SYNC_URL: ${{ vars.TERMINDO_SYNC_URL }}
          # Release endpoint for the update check (GitHub "latest release" JSON).
          # Empty = api.github.com/repos/bionyxxx/termindo/releases/latest.
          TERMINDO_UPDATE_URL: ${{ vars.TERMINDO_UPDATE_URL }}
        run: npx tauri build ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: termindo-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "Termindo ${GITHUB_REF_NAME}" \
            $(find dist -type f)
